<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 22nd Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        /* CSS RESET & CORE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s ease, visibility 1s ease;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('bg-hbd.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 110%;
            animation: backgroundMove 20s ease-in-out infinite alternate;
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
            transition: transform 0.2s;
            animation: pulse 2s infinite;
        }

        .btn-start:hover {
            transform: scale(1.1);
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease;
        }

        #topSection {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 5px solid #e94560;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
            position: relative;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #e94560;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ddd;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(233, 69, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); }
        }

        .show-content {
            opacity: 1;
            transform: translateY(0);
        }

        #magicGallery {
            max-width: 600px;
            margin: 0 auto;
        }

        .gallery-item {
            margin-bottom: 40px;
        }

        .gallery-media {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .reveal {
            opacity: 0;
            transform: translateY(70px);
            transition: all 1s ease;
        }

        .reveal.show {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes backgroundMove {
            0% { background-size: 110%; background-position: center center; }
            100% { background-size: 130%; background-position: center top; }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <button class="btn-start" id="startBtn" onclick="startIntro()">Mulai</button>

        <h1 id="countdown" style="
            font-size: 4rem;
            font-weight: 600;
            margin-top: 20px;
            display:none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        ">10</h1>

        <div id="afterCountdown" style="display:none; text-align:center;">
            <h3 style="margin-bottom: 20px; font-weight: 300; font-size: 1.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">
                Ada kejutan buat Kamu...
            </h3>

            <button class="btn-start" onclick="startCelebration()">Buka Sekarang 🎁</button>
        </div>
    </div>

    <div id="topSection">
        <div class="card" id="mainCard">
            <div class="photo-container">
                <img src="dhieva.jpeg" alt="Birthday Person">
            </div>
            
            <h1>Happy Birthday!</h1>
            <h2>Turning 22 🎉</h2>
            
            <p>
                Selamat ulang tahun yang ke-22! <br>
                Semoga di usia ini makin dewasa, bahagia selalu, 
                tercapai semua cita-citanya, dan menjadi versi terbaik dari dirimu.
                <br><br>
                <i>Keep shining! ✨</i>
            </p>

            <small style="color: #aaa;">Scroll for magic ✨</small>
        </div>
    </div>

    <div id="magicGallery" style="padding: 80px 20px; opacity:0;">
        <h2 style="text-align:center; margin-bottom:40px;">Magic Moments ✨</h2>

        <div class="gallery-item reveal">
            <img src="20.jpeg" class="gallery-media" />
        </div>

        <div class="gallery-item reveal">
            <img src="20-2.jpeg" class="gallery-media" />
        </div>

        <div class="gallery-item reveal">
            <video class="gallery-media" controls>
                <source src="21.mp4" type="video/mp4">
            </video>
        </div>

        <div class="gallery-item reveal">
            <img src="20.jpg" class="gallery-media" />
        </div>
    </div>

    <!-- PERBAIKAN: preload audio -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="hbd.mp3" type="audio/mpeg">
        Browser kamu tidak mendukung audio.
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        let countdownValue = 10;
        const audio = document.getElementById('bgMusic');

        // PRELOAD (agar tidak telat saat play)
        audio.preload = "auto";
        audio.load();

        function startIntro() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("countdown").style.display = "block";

            audio.volume = 0.8;
            audio.play().catch(e => console.log("Error:", e));

            startCountdown();
        }

        function startCountdown() {
            const countdownEl = document.getElementById("countdown");
            const afterCd = document.getElementById("afterCountdown");

            const timer = setInterval(() => {
                countdownValue--;
                countdownEl.textContent = countdownValue;

                if (countdownValue <= 0) {
                    clearInterval(timer);
                    countdownEl.style.display = "none";
                    afterCd.style.display = "block";
                }
            }, 1000);
        }

        function startCelebration() {
            const overlay = document.getElementById('overlay');
            const card = document.getElementById('mainCard');

            overlay.style.opacity = '0';

            setTimeout(() => {
                overlay.style.display = 'none';
                card.classList.add('show-content');
                fireConfetti();
            }, 800);
        }

        function fireConfetti() {
            var duration = 15 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) return clearInterval(interval);

                var particleCount = 50 * (timeLeft / duration);

                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
                }));

                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
                }));
            }, 250);
        }

        let firstScrollTriggered = false;

        window.addEventListener("scroll", () => {
            const gallery = document.getElementById("magicGallery");

            if (!firstScrollTriggered && window.scrollY > 50) {
                firstScrollTriggered = true;

                setTimeout(() => {
                    window.scrollTo({
                        top: gallery.offsetTop - 40,
                        behavior: "smooth"
                    });
                }, 200);

                setTimeout(() => {
                    gallery.style.opacity = 1;
                }, 300);
            }

            const reveals = document.querySelectorAll(".reveal");

            reveals.forEach((item) => {
                const rect = item.getBoundingClientRect();

                if (rect.top < window.innerHeight - 100) {
                    item.classList.add("show");
                }
            });
        });

    </script>
</body>
</html>
